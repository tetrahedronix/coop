# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'  # attivato quando crei un tag v1.0.0, v2.1.0, ecc.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Esegui test finali
        run: go test -race ./...

      - name: Crea release su GitHub
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            # Se in futuro avrai binari da allegare
            # ./bin/myapp